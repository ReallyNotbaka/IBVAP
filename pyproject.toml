[project]
name = "ibvap"
version = "0.1.0"
description = "IBVAP — Intelligent Border Video Analytics Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "IBVAP Team" }]
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.2.9",
    "greenlet>=3.0",
    "av==18.1.0",
    "opencv-python==5.0.0.93",
    "numpy==2.3.5",
    "pillow==12.3.0",
    "pyyaml==6.0.2",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "websockets==15.0.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "structlog==25.4.0",
    "opentelemetry-api==1.37.0",
    "opentelemetry-sdk==1.37.0",
    "prometheus-client==0.22.1",
    "paddleocr==3.7.0",
    "onnxruntime-directml==1.24.4",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
openvino = ["openvino==2026.3.1"]
cuda = ["onnxruntime-gpu==1.29.0"]

[project.scripts]
ibvap = "ibvap.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.3.0",
    "httpx==0.28.1",
    "ruff==0.14.4",
    "pyright==1.1.408",
    "hypothesis==6.145.0",
    "anyio==4.11.0",
    "respx==0.22.0",
    "factory-boy==3.3.2",
]

[tool.ruff]
line-length = 160
target-version = "py312"
cache-dir = ".ruff_cache"
extend-exclude = [
    ".venv/",
    ".ruff_cache/",
    "__pycache__/",
    "frontend/",
    "node_modules/",
    "frontend/dist/",
    "data/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["ibvap", "scripts", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts", "run.py"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", ".venv", "frontend", ".pytest_cache", "data"]
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportUnusedImport = false
reportUnusedVariable = false
reportPrivateUsage = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportReturnType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --durations=10"
cache_dir = ".pytest_cache"
norecursedirs = [".venv", ".git", ".ruff_cache", "frontend", "node_modules", "dist", "build", "data", "__pycache__"]
xfail_strict = true
markers = [
    "slow: timing-heavy tests (deselect with '-m \"not slow\"' for a fast gate)",
    "soak: long-running stability/soak tests",
    "benchmark: hardware benchmark tests, timing-sensitive",
    "live: requires live external services (DB, MediaMTX)",
    "gpu: requires a GPU execution provider",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.alembic]
script_location = "migrations"
