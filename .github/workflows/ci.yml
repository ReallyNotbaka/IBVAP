name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ibvap
          POSTGRES_USER: ibvap
          POSTGRES_PASSWORD: ibvap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibvap -d ibvap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync (frozen)
        run: uv sync --frozen --group dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pyright strict
        run: uv run pyright
      - name: Pytest
        env:
          IBVAP_DB__URL: postgresql+asyncpg://ibvap:ibvap@localhost:5432/ibvap
          DATABASE_URL: postgresql+psycopg://ibvap:ibvap@localhost:5432/ibvap
        run: uv run pytest -q --cov=src --cov-report=term-missing
      - name: Alembic upgrade head (empty→latest)
        env:
          DATABASE_URL: postgresql+psycopg://ibvap:ibvap@localhost:5432/ibvap
        run: uv run alembic upgrade head
      - name: Alembic downgrade → upgrade
        env:
          DATABASE_URL: postgresql+psycopg://ibvap:ibvap@localhost:5432/ibvap
        run: |
          uv run alembic downgrade -1 || uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
