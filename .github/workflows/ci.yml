name: ci
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly slow suite (UTC)
  workflow_dispatch:

# Cancel superseded runs on the same ref — faster CI queue, less runner waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ibvap
          POSTGRES_USER: ibvap
          POSTGRES_PASSWORD: ibvap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibvap -d ibvap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync (frozen)
        run: uv sync --frozen --group dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pyright (basic gate)
        run: uv run pyright
      - name: Pytest (fast gate)
        env:
          IBVAP_DB__URL: postgresql+asyncpg://ibvap:ibvap@localhost:5432/ibvap
          DATABASE_URL: postgresql+psycopg://ibvap:ibvap@localhost:5432/ibvap
          # Dump Python tracebacks on fatal signals (teardown SIGABRT triage).
          PYTHONFAULTHANDLER: "1"
          # Fixed hash seed: reproducible GC/teardown order across runs, so a
          # teardown abort is either deterministic (bisectable) or gone.
          PYTHONHASHSEED: "0"
        # DIAGNOSTIC (CI teardown-abort triage — collapse back to one line
        # once green): surface the pytest exit code plus the phase markers
        # written by tests/conftest.py, then propagate the real exit code.
        run: |
          set +e
          uv run pytest -q -m "not slow and not soak and not benchmark and not live and not gpu" --cov=src --cov-report=term-missing --durations=20
          CODE=$?
          echo "PYTEST_EXIT=$CODE"
          cat /tmp/pytest-phase.log || true
          exit $CODE
      - name: Alembic upgrade head (empty→latest)
        env:
          DATABASE_URL: postgresql+psycopg://ibvap:ibvap@localhost:5432/ibvap
        run: uv run alembic upgrade head
      - name: Alembic downgrade → upgrade (strict)
        env:
          DATABASE_URL: postgresql+psycopg://ibvap:ibvap@localhost:5432/ibvap
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

  slow:
    name: slow (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fast gate stays green on every push/PR; the heavy suite runs nightly or
    # on manual dispatch only. No postgres service: the slow/live/gpu
    # selection uses sqlite, mock servers, and cached model weights.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync (frozen)
        run: uv sync --frozen --group dev
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models/
          key: models-${{ hashFiles('models/*.onnx') }}
          restore-keys: |
            models-
      - name: Pytest (slow/live/gpu suite)
        run: uv run pytest -q -m "slow or soak or benchmark or live or gpu" --durations=20

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
