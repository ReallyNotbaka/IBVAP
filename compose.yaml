name: ibvap

services:
  postgres:
    image: postgres:17-alpine@sha256:0c67ff4fb6c03e2a22baf5631b1adb63978317c901a45fb43eecdb10cc949ee6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibvap
      POSTGRES_USER: ibvap
      POSTGRES_PASSWORD: ibvap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibvap -d ibvap"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["dev", "cpu", "openvino", "cuda", "observability"]

  mediamtx:
    image: bluenviron/mediamtx:v1.20.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      retries: 10
      start_period: 15s
    profiles: ["dev", "cpu"]

  # - observability stack (Prometheus + Grafana) omitted in dev for brevity; see docs/

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # DATABASE_URL is read by alembic env.py; the app itself only reads
      # IBVAP_* env (Settings env_prefix IBVAP_, nested __), so the app URL
      # must be set explicitly or the container fail-closes to localhost.
      DATABASE_URL: postgresql+asyncpg://ibvap:ibvap@postgres:5432/ibvap
      IBVAP_DB__URL: postgresql+asyncpg://ibvap:ibvap@postgres:5432/ibvap
      IBVAP_API_TOKEN: ${IBVAP_API_TOKEN:-}
      IBVAP_DB__ALLOW_SQLITE_FALLBACK: ${IBVAP_DB__ALLOW_SQLITE_FALLBACK:-0}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
